---
- name: Deploy Flask app to app servers
  hosts: app_servers
  become: true

  vars:
    image_name: sree6303/cicd-flask-app
    image_tag: latest
    container_name: flask-app
    host_port: 80
    app_port: 5000

  tasks:
    - name: Install Docker and the Python Docker library
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Make sure Docker is running and starts on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run the app container (replaces it if the image changed)
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        pull: true
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:{{ app_port }}"
        env:
          APP_VERSION: "{{ image_tag }}"

    - name: Wait until the app reports healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/health"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

    - name: Remove old unused images to save disk
      ansible.builtin.command: docker image prune -af
      changed_when: false